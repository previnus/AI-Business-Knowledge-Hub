[project]
name = "company-knowledge-hub"
version = "0.1.0"
authors = [{ name = "Previn Kalisetty Appadu" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "authlib>=1.6",
    "beautifulsoup4>=4.13",
    "fastapi>=0.121",
    "httpx>=0.28",
    "joserfc>=1.5",
    "openai>=2",
    "prometheus-client>=0.23",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2",
    "pypdf>=6",
    "python-multipart>=0.0.22",
    "tiktoken>=0.12",
    "uvicorn>=0.38",
]

[project.urls]
Author = "https://previn.me"

[dependency-groups]
dev = ["httpx2>=2", "pytest>=9", "ruff>=0.14"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
