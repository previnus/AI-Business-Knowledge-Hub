name: Verify Knowledge Hub

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: hub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -d hub_test -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      HUB_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/hub_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run --locked ruff check hub tests
      - run: uv run --locked pytest
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - run: docker compose config --quiet
      - run: docker compose build api web backup
