name: Verify Knowledge Hub

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: hub_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -d hub_test -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      HUB_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/hub_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.19"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run --locked ruff check hub tests
      - run: uv run --locked pytest
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - run: docker compose config --quiet
      - run: docker compose build api web backup
      - name: Verify Compose startup, administrator setup, and encrypted backup
        shell: bash
        env:
          OIDC_ISSUER: https://identity.example.test
          OIDC_CLIENT_ID: knowledge-hub-ci
        run: |
          umask 077
          mkdir secrets backups
          openssl rand -hex 32 > secrets/postgres_password
          printf 'host=db dbname=knowledgehub user=hub_runtime password=%s\n' \
            "$(openssl rand -hex 32)" > secrets/database_url
          printf 'synthetic-ci-value\n' > secrets/oidc_client_secret
          printf 'synthetic-ci-value\n' > secrets/openai_api_key
          sudo chgrp 10001 secrets/* backups
          sudo chmod 0640 secrets/*
          sudo chmod 0770 backups
          docker compose up -d --wait --wait-timeout 120
          ca_file="$(mktemp)"
          docker compose exec -T web cat /data/caddy/pki/authorities/local/root.crt > "$ca_file"
          curl --fail --silent --show-error --cacert "$ca_file" https://localhost/api/health/ready
          test "$(curl --silent -o /dev/null -w '%{redirect_url}' http://localhost/)" = 'https://localhost/'
          test "$(curl --silent --show-error --cacert "$ca_file" -o /dev/null -w '%{http_code}' https://localhost/api/me)" = 401
          test "$(curl --silent --show-error --cacert "$ca_file" -o /dev/null -w '%{http_code}' https://localhost/metrics)" = 404
          docker compose run --rm -T migrate python -m hub.manage grant-admin synthetic-admin
          docker compose run --rm -T migrate python -m hub.manage disable-admin synthetic-admin
          recipient="$(docker compose run --rm -T --no-deps --entrypoint sh backup -ec \
            'age-keygen -o /tmp/ci-age-key 2>/dev/null; age-keygen -y /tmp/ci-age-key')"
          AGE_RECIPIENT="$recipient" docker compose run --rm -T backup
          sudo grep -a -m1 -q '^age-encryption.org/v1$' backups/*.dump.age
      - name: Show deployment status
        if: failure()
        run: docker compose ps --all && docker compose logs --tail 50
